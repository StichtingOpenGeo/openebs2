name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: openebs
          POSTGRES_PASSWORD: openebs
          POSTGRES_DB: openebs2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev libgeos-dev libpq-dev

      - name: Install dependencies
        run: uv sync --locked

      - name: Write local_settings
        run: .github/scripts/write_local_settings.sh

      - name: Run tests
        run: uv run python manage.py test

  typecheck:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install psycopg2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ty
        run: uv run ty check --output-format github

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: openebs
          POSTGRES_PASSWORD: openebs
          POSTGRES_DB: openebs2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev libgeos-dev libpq-dev

      - name: Install dependencies
        run: uv sync --locked

      - name: Write local_settings
        run: .github/scripts/write_local_settings.sh

      - name: Migrate
        run: uv run python manage.py migrate --noinput

      - name: Import stop and line data
        run: |
          .github/scripts/make_rid_fixture.sh "${RUNNER_TEMP}/rid"
          uv run python manage.py import_rid "${RUNNER_TEMP}/rid"

      - name: Create the smoke test user
        run: |
          uv run python manage.py createsuperuser --noinput --username smoke --email smoke@example.com
        env:
          DJANGO_SUPERUSER_PASSWORD: smoke-password

      - name: Start the server
        run: |
          # Not uv run: it would hold the uv cache lock until the job ends, and setup-uv's cache prune times out waiting for it
          .venv/bin/python manage.py runserver 8000 --noreload > "${RUNNER_TEMP}/server.log" 2>&1 &
          for i in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/inloggen/ && exit 0
            sleep 1
          done
          echo "server did not come up"; cat "${RUNNER_TEMP}/server.log"; exit 1

      - name: Check the pages load
        run: uv run python .github/scripts/smoke.py http://127.0.0.1:8000

      - name: Server log
        if: always()
        run: cat "${RUNNER_TEMP}/server.log"
