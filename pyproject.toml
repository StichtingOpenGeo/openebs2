[project]
name = "openebs2"
version = "0.1.0"
description = "Tool for posting KV15 messages"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "django>=4.2.0,<4.3",
    "psycopg2==2.9.10", # 2.9.9 does not build on Python 3.13
    "django-floppyforms",
    "django-crispy-forms>=2.1.0,<2.2",
    "jsonfield==3.1.0", # Imported by kv1/models.py
    "django-leaflet==0.29.1",
    "django-geojson==4.0.0",
    "setuptools<81", # django-geojson 4.0.0 imports pkg_resources, dropped in setuptools 81 - see #236
    "pyzmq", # Verification feed
    "django-braces==1.15.0",
    "future==1.0.0",
    "python-dateutil",
    "crispy-bootstrap3==2024.1",
    "django-allauth[socialaccount]",
    "lxml==6.1.0", # SIRI-SX push (utils/push.py, utils/siri_sx.py) and tests
]

[tool.uv.sources]
django-floppyforms = { git = "https://github.com/jazzband/django-floppyforms.git" }

[dependency-groups]
dev = [
    "django-stubs>=4.2,<4.3",
    "lxml-stubs>=0.5.1",
    "ty>=0.0.92",
]

[tool.ty.src]
exclude = ["**/south_migrations/**"] # South is long gone; Django never loads these

[tool.ty.rules]
# ty has no Django plugin, so it can't see reverse relations, request.user's
# concrete type or the signatures Django's class-based views override. Warn
# on these instead of failing the build.
unresolved-attribute = "warn"
invalid-method-override = "warn"
invalid-attribute-override = "warn"
# Mostly Optional narrowing ty can't follow through Django forms and views
# (cleaned_data, request.GET.get, date | None). Promote back to errors once
# the existing warnings are cleaned up.
invalid-argument-type = "warn"
not-subscriptable = "warn"
unsupported-operator = "warn"

[tool.ty.terminal]
error-on-warning = false # Only errors fail the build; warnings are the backlog above
